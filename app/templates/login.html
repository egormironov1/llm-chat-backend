{% extends "base.html" %}

{% block title %}Login - LLM Chat{% endblock %}

{% block content %}
<div class="center-wrap">
    <div class="auth-card">
        <h1>Login</h1>
        <p>Sign in with your login and password or continue with GitHub.</p>

        {% if error %}
            <div class="error-box">
                {{ error }}
            </div>
        {% endif %}

        <form method="post" action="/ui/login">
            <div class="form-group">
                <label for="login">Login</label>
                <input class="input" type="text" id="login" name="login" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input class="input" type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>

        <div style="height: 14px;"></div>

        <a href="/auth/github" class="btn btn-secondary btn-full">Continue with GitHub</a>

        <div class="auth-footer">
            No account yet? <a href="/ui/register">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
