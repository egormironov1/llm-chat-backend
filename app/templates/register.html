{% extends "base.html" %}

{% block title %}Register - LLM Chat{% endblock %}

{% block content %}
<div class="center-wrap">
    <div class="auth-card">
        <h1>Create account</h1>
        <p>Create your personal account to start working with chats.</p>

        {% if error %}
            <div class="error-box">
                {{ error }}
            </div>
        {% endif %}

        <form method="post" action="/ui/register">
            <div class="form-group">
                <label for="login">Login</label>
                <input class="input" type="text" id="login" name="login" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input class="input" type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Register</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="/ui/login">Login here</a>
        </div>
    </div>
</div>
{% endblock %}
