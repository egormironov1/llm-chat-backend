services:
  postgres:
    image: postgres:16
    container_name: llm_chat_postgres
    environment:
      POSTGRES_DB: llm_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: llm_chat_redis
    ports:
      - "6379:6379"